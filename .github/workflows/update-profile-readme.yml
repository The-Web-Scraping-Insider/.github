name: Update profile README

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:        # "Run workflow" button for an instant refresh
  push:
    branches: [main]
    paths: ["shared/org.yml", "scripts/update_repos.py", "scripts/update_newsletter.py", "scripts/update_amas.py", ".github/workflows/update-profile-readme.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: pip install pyyaml

      - name: Rebuild projects table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_repos.py

      - name: Rebuild latest newsletter issues
        run: python3 scripts/update_newsletter.py

      - name: Rebuild recent AMAs
        run: python3 scripts/update_amas.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "Nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "Update projects, newsletter issues and AMAs"
          git push
